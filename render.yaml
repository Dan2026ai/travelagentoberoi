services:
  - type: web
    name: travel-planner
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: AGENT_ID
        value: agent_01NjGHwuJrnXPVnz8NyXDQ7H
      - key: ENVIRONMENT_ID
        value: env_01JELFo54zPmUXZ5psheKCiw
      - key: ACCESS_CODE
        sync: false
      - key: MAX_MESSAGES_PER_HOUR
        value: "5"
      - key: SESSION_BUDGET_USD
        value: "3"
